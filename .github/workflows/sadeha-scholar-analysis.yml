name: Analyze Sadeha Scholar Corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sadeha-scholar-analysis.yml'
      - 'tools/fetch-authoritative-sadeha-html.py'
      - 'tools/sadeha-discovery-summary.py'
      - 'tools/classify-sadeha-volumes.py'
      - 'tools/build-sadeha-videha-map.py'
      - 'tools/build-sadeha-unique-audit.py'
      - 'tools/build-sadeha-article-inventory.py'
      - 'tools/build-sadeha-scholar-records.py'
      - 'search-documents/sadeha-*.html'

permissions:
  contents: write

concurrency:
  group: sadeha-scholar-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            data
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authoritative Sadeha search HTML corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch-authoritative-sadeha-html.py
      - name: Build compact discovery summary
        run: python tools/sadeha-discovery-summary.py
      - name: Classify Sadeha volumes
        run: python tools/classify-sadeha-volumes.py
      - name: Map Sadeha reprints to original Videha articles
        run: python tools/build-sadeha-videha-map.py
      - name: Audit Sadeha-unique scholarly residuals
        run: python tools/build-sadeha-unique-audit.py
      - name: Commit analysis data
        run: |
          git config user.name "videha-sadeha-scholar-bot"
          git config user.email "videha-sadeha-scholar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update Sadeha Scholar analysis data [skip actions]"
            git pull --rebase origin main
            git push
          fi
