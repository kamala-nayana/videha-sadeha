name: Build Sadeha Federated Search

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pagefind-videha-search/**'
      - 'panji-shards/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videha-sadeha-generated-assets-main
  cancel-in-progress: false

jobs:
  build-search:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout HTML corpus and tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /*.htm
            /**/*.html
            /**/*.htm
            /.github/
            /tools/
            /pagefind-videha-search/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Sadeha corpus
        run: python3 tools/videha-sadeha-pagefind-prepare.py . _pagefind_videha_build

      - name: Build Pagefind
        run: npx -y pagefind@1.5.2 --site _pagefind_videha_build --output-subdir pagefind-videha-search --glob '**/*.{html,htm}'

      - name: Install search bundle
        run: |
          rm -rf pagefind-videha-search
          cp -R _pagefind_videha_build/pagefind-videha-search ./pagefind-videha-search
          rm -rf _pagefind_videha_build

      - name: Commit search index safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind-videha-search
          if git diff --cached --quiet; then
            echo "Sadeha search unchanged."
            exit 0
          fi
          git commit -m "Build Sadeha federated search index"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another writer; retrying ($attempt/3)..."
            sleep $((attempt * 2))
          done
          echo "Unable to push generated search index after 3 attempts."
          exit 1
