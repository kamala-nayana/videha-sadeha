name: Verify Sadeha Scholar Source Documents

# Existing search-documents/sadeha-*.html files are authoritative. Verify them
# through the Git Trees API; do not check out or rewrite PDFs/HTML.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sadeha-scholar-source.yml'
      - 'search-documents/sadeha-*.html'

permissions:
  contents: read

concurrency:
  group: sadeha-scholar-source-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify authoritative Sadeha HTML corpus
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; ref=os.environ['GITHUB_SHA']; token=os.environ.get('GITHUB_TOKEN','')
          url=f'https://api.github.com/repos/{repo}/git/trees/{ref}?recursive=1'
          headers={'Accept':'application/vnd.github+json','User-Agent':'Videha-Sadeha-Scholar/1.0'}
          if token: headers['Authorization']=f'Bearer {token}'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=60) as r: payload=json.load(r)
          if payload.get('truncated'): raise SystemExit('Git tree response truncated')
          files=[]
          for x in payload.get('tree',[]):
              path=str(x.get('path') or ''); name=path.rsplit('/',1)[-1]
              if x.get('type')=='blob' and path.startswith('search-documents/') and name.lower().startswith('sadeha-') and name.lower().endswith('.html'):
                  files.append((name,x.get('size'),x.get('sha'),path))
          files.sort(key=lambda x:x[0].lower())
          print(f'Authoritative Sadeha search HTML files: {len(files)}')
          for row in files: print(*row)
          if len(files)<38: raise SystemExit(f'Expected at least 38 authoritative Sadeha search HTML files; found {len(files)}')
