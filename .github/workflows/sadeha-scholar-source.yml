name: Verify Sadeha Scholar Source Documents

# The existing search-documents/sadeha-*.html files are the authoritative source
# layer. PDF extraction is retained in tools only as a manual recovery option and
# must never overwrite these HTML sources automatically.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sadeha-scholar-source.yml'
      - 'search-documents/sadeha-*.html'

permissions:
  contents: read

concurrency:
  group: sadeha-scholar-source-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            search-documents
          sparse-checkout-cone-mode: true
      - name: Verify authoritative Sadeha HTML corpus
        shell: python
        run: |
          from pathlib import Path
          files=sorted(Path('search-documents').glob('sadeha-*.html'))
          print(f'Authoritative Sadeha search HTML files: {len(files)}')
          for p in files:
              print(p.as_posix(), p.stat().st_size)
          if len(files) < 38:
              raise SystemExit(f'Expected at least 38 authoritative Sadeha search HTML files; found {len(files)}')
